bio: |
  Spencer Hilligoss is a PhD candidate in Statistics at the University of California, Irvine,
  advised by Dr. Annie Qu and Dr. Tianchen Qian. His research develops statistical and machine
  learning methodology for valid inference and prediction on heterogeneous, multi-modal time
  series, spanning causal mediation analysis, generative diffusion modeling, and selective
  inference, with applications to mobile health, personalized medicine, and financial data.
  His work on causal mediation in continuous glucose monitoring was published in
  npj Metabolic Health and Disease, and he is pursuing a career in quantitative research.

