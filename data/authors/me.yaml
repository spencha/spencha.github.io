bio: |
  Spencer Hilligoss is a PhD candidate in Statistics at the University of California, Irvine,
  advised by Dr. Annie Qu and Dr. Tianchen Qian. His research develops methods for causal
  mediation analysis, representation learning, and generative modeling of complex time series,
  with applications spanning personalized medicine, mobile health, and financial data. His
  work on causal mediation in continuous glucose monitoring was recently published in
  npj Metabolic Health and Disease.

